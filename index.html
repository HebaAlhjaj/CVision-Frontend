<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVision — Smart CV Analysis & Team Role Distribution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body, #root {
        min-height: 100%;
        background: #F4F7FA;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color: #142B46;
        text-rendering: optimizeLegibility;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        line-height: 1.25;
        letter-spacing: -0.3px;
      }

      /* CSS variables for consistent spacing and typography */
      :root {
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;
        --space-12: 48px;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 20px;
        --radius-full: 999px;
        --font-xs: 11px;
        --font-sm: 13px;
        --font-base: 14px;
        --font-md: 15px;
        --font-lg: 18px;
        --font-xl: 24px;
        --font-2xl: 30px;
        --font-3xl: 36px;
        --color-bg: #F4F7FA;
        --color-white: #FFFFFF;
        --color-primary: #0F2D52;
        --color-dark: #16314D;
        --color-muted: #4B6882;
        --color-border: #E2EAF1;
        --color-hover: #8EA0B5;
        --shadow-sm: 0 2px 10px rgba(20,43,70,0.06);
        --shadow-md: 0 8px 24px rgba(20,43,70,0.10);
        --shadow-lg: 0 16px 40px rgba(20,43,70,0.14);
        --transition: all 0.25s ease;
      }

      /* Smooth focus ring for keyboard nav */
      :focus-visible {
        outline: 2px solid #16314D;
        outline-offset: 2px;
      }

      /* Remove default button/input appearance */
      button { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      input, textarea, select { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }

      /* Smooth scrolling */
      html { scroll-behavior: smooth; }

      /* Progress bar animation utility */
      @keyframes progressGrow {
        from { width: 0%; }
        to { width: var(--target-width); }
      }

      /* Fade in utility */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
